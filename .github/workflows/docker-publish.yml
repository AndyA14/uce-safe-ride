name: 🐳 Build & Push Docker Images (QA)

on:
  push:
    branches: [ "qa" ]

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    # environment: qa  <-- Borra o comenta esto si te da problemas, ya no lo necesitamos urgente

    strategy:
      fail-fast: false
      matrix:
        service: 
          - vehicle-service
          - trip-service
          - route-service
          - auth-service
          - tracking-service
          - simulation-service
          - driver-service
          - notification-service
          - gateway-service
          - stop-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # 👇 1. ESCRIBE TU USUARIO AQUÍ DIRECTAMENTE (sin comillas)
          username: aceofglass14
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            aceofglass14/uce-${{ matrix.service }}:qa
            aceofglass14/uce-${{ matrix.service }}:${{ github.sha }}