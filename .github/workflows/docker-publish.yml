name: 🐳 Build & Push Docker Images (QA)

on:
  push:
    branches: [ "qa" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: qa
    strategy:
      fail-fast: false
      matrix:
        service: 
          - vehicle-service
          - trip-service
          - route-service
          - auth-service
          - tracking-service
          - simulation-service
          - passenger-service
          - driver-service
          - payment-service
          - notification-service
          - audit-service
          - analytics-service
          - admin-service
          - gateway-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          # Confirmado por tu imagen: la carpeta se llama 'backend'
          context: ./backend/${{ matrix.service }}
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/uce-${{ matrix.service }}:qa
            ${{ secrets.DOCKER_USERNAME }}/uce-${{ matrix.service }}:${{ github.sha }}