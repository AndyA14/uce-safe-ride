name: 🐳 Smart Build & Push (QA)

on:
  push:
    branches: [ "qa" ]

jobs:
  # JOB 1: EL DETECTIVE 🕵️‍♂️
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: qa
          filters: |
            auth-service: backend/services/auth-service/**
            driver-service: backend/services/driver-service/**
            notification-service: backend/services/notification-service/**
            route-service: backend/services/route-service/**
            simulation-service: backend/services/simulation-service/**
            stop-service: backend/services/stop-service/**
            student-service: backend/services/student-service/**
            tracking-service: backend/services/tracking-service/**
            trip-service: backend/services/trip-service/**
            vehicle-service: backend/services/vehicle-service/**
            ws-gateway: backend/services/ws-gateway/**
            web-student: frontend/web-student/** 

  # JOB 2: EL CONSTRUCTOR 🏗️
  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    
    runs-on: ubuntu-latest
    environment: qa
    
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: aceofglass14
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'web-student' && './frontend/web-student' || (matrix.service == 'simulation-service' && format('./backend/services/{0}', matrix.service) || './backend') }}

          file: ${{ matrix.service == 'web-student' && './frontend/web-student/Dockerfile' || format('./backend/services/{0}/Dockerfile', matrix.service) }}
          
          push: true
          tags: |
            aceofglass14/uce-${{ matrix.service }}:qa
            aceofglass14/uce-${{ matrix.service }}:${{ github.sha }}