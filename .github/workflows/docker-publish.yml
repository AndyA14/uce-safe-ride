name: 🐳 Build & Push Docker Images (QA)

on:
  push:
    branches: [ "qa" ]

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        # 👇 SOLO LAS CARPETAS QUE VEO EN TU FOTO
        service: 
          - auth-service
          - driver-service
          - notification-service
          - route-service
          - simulation-service
          - stop-service
          - student-service
          - tracking-service
          - trip-service
          - vehicle-service
          - ws-gateway

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: aceofglass14
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          # 👇👇👇 AQUÍ ESTABA EL ERROR: FALTABA /services/ 👇👇👇
          context: ./backend/services/${{ matrix.service }}
          file: ./backend/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            aceofglass14/uce-${{ matrix.service }}:qa
            aceofglass14/uce-${{ matrix.service }}:${{ github.sha }}