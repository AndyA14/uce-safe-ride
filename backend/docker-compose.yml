networks:
  uce-net:
    driver: bridge

volumes:
  postgres_data:

services:
  # ==================================================
  # ZOOKEEPER
  # ==================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # KAFKA
  # ==================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - uce-net
    restart: unless-stopped

# ==================================================
  # MONGODB
  # ==================================================
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    networks:
      - uce-net
    restart: unless-stopped


  # ==================================================
  # POSTGRESQL
  # ==================================================
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uce_default
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # AUTH SERVICE
  # ==================================================
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
      JWT_ISSUER: uce-safe-ride
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # STUDENT SERVICE
  # ==================================================
  student-service:
    build:
      context: .
      dockerfile: services/student-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_student
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
      JWT_ISSUER: uce-safe-ride
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # DRIVER SERVICE
  # ==================================================
  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_driver
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # VEHICLE SERVICE
  # ==================================================
  vehicle-service:
    build:
      context: .
      dockerfile: services/vehicle-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_vehicle
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
      JWT_ISSUER: uce-safe-ride
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # ROUTE SERVICE
  # ==================================================
  route-service:
    build:
      context: .
      dockerfile: services/route-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_route
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
      JWT_ISSUER: uce-safe-ride
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8003:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # STOP SERVICE
  # ==================================================
  stop-service:
    build:
      context: .
      dockerfile: services/stop-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_stop
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8007:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # NOTIFICATION SERVICE
  # ==================================================
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPICS: route.started,bus.near_stop,payment.completed,route.traffic_detected,bus.arrived_uce
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8008:8000"
    networks:
      - uce-net
    restart: unless-stopped
