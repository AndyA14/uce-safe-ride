services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uce_safe_ride
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_safe_ride
      JWT_SECRET_KEY: super-secret-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      UCE_EMAIL_DOMAIN: "@uce.edu.ec"
    depends_on:
      - postgres
    ports:
      - "8001:8000"

  student-service:
    build:
      context: .
      dockerfile: services/student-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_student
      JWT_SECRET_KEY: super-secret-change-me
      JWT_ISSUER: uce-safe-ride
    depends_on:
      - postgres
    ports:
      - "8002:8000"
