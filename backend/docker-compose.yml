networks:
  uce-net:
    driver: bridge

volumes:
  postgres_data:

services:
  # ==================================================
  # RABBITMQ
  # ==================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - uce-net
    environment:
      RABBITMQ_DEFAULT_USER: uce
      RABBITMQ_DEFAULT_PASS: uce123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================================================
  # ZOOKEEPER
  # ==================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # KAFKA
  # ==================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # MONGODB
  # ==================================================
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # POSTGRESQL
  # ==================================================
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uce_default
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # REDIS
  # ==================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - uce-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MQTT Broker ====================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    user: root  
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./services/simulation-service/mosquitto/config:/mosquitto/config
      - ./services/simulation-service/mosquitto/data:/mosquitto/data
      - ./services/simulation-service/mosquitto/log:/mosquitto/log
    networks:
      - uce-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================================================
  # AUTH SERVICE
  # ==================================================
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_auth
      SECRET_KEY: uce-safe-ride-secreto-2026
      JWT_SECRET_KEY: uce-safe-ride-secreto-2026
      JWT_ISSUER: uce-safe-ride
      JWT_ALGORITHM: HS256
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # STUDENT SERVICE
  # ==================================================
  student-service:
    build:
      context: .
      dockerfile: services/student-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_student
      JWT_SECRET_KEY: uce-safe-ride-secreto-2026
      JWT_ISSUER: uce-safe-ride
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # DRIVER SERVICE
  # ==================================================
  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_driver
      JWT_SECRET_KEY: uce-safe-ride-secreto-2026
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: uce
      RABBITMQ_PASS: uce123
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8005:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # VEHICLE SERVICE
  # ==================================================
  vehicle-service:
    build:
      context: .
      dockerfile: services/vehicle-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_vehicle
      JWT_SECRET_KEY: uce-safe-ride-secreto-2026
      JWT_ISSUER: uce-safe-ride
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # ROUTE SERVICE
  # ==================================================
  route-service:
    build:
      context: .
      dockerfile: services/route-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_route
      JWT_SECRET_KEY: uce-safe-ride-secreto-2026
      JWT_ISSUER: uce-safe-ride
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8003:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # STOP SERVICE
  # ==================================================
  stop-service:
    build:
      context: .
      dockerfile: services/stop-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_stop
      JWT_SECRET_KEY: uce-safe-ride-secreto-2026
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8007:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # NOTIFICATION SERVICE
  # ==================================================
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPICS: route.started,bus.near_stop,payment.completed,route.traffic_detected,bus.arrived_uce
      KAFKA_TOPIC_TRIPS: trips
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: uce
      RABBITMQ_PASSWORD: uce123
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8008:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # WS GATEWAY 
  # ==================================================
  ws-gateway:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: uce
      RABBITMQ_PASSWORD: uce123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: 1
      JWT_SECRET_KEY: uce-safe-ride-secreto-2026
      JWT_ALGORITHM: HS256
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_TRIPS: trips
      KAFKA_TOPIC_ALERTS: notification.alerts
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8009:8000"
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # TRIP SERVICE 
  # ==================================================
  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    container_name: trip-service
    ports:
      - "8010:8000"
    volumes:
      - ./services/trip-service:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/uce_trip
      SECRET_KEY: uce-safe-ride-secreto-2026
      JWT_SECRET_KEY: uce-safe-ride-secreto-2026
      JWT_ISSUER: uce-safe-ride
      JWT_ALGORITHM: HS256
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: uce
      RABBITMQ_PASSWORD: uce123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      ROUTE_SERVICE_URL: http://route-service:8000
      DRIVER_SERVICE_URL: http://driver-service:8000
      VEHICLE_SERVICE_URL: http://vehicle-service:8000
      STUDENT_SERVICE_URL: http://student-service:8000
      STOP_SERVICE_URL: http://stop-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - uce-net
    restart: unless-stopped

  # ==================================================
  # TRACKING SERVICE 
  # ==================================================
  tracking-service:
    build:
      context: .
      dockerfile: services/tracking-service/Dockerfile
    container_name: tracking-service
    ports:
      - "8006:8000"  
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: tracking_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_TRIPS: trips
      KAFKA_GROUP_ID: tracking_group
    depends_on:
      mongo:
        condition: service_healthy 
      kafka:
        condition: service_healthy 
    networks:
      - uce-net 
    restart: unless-stopped

  # ==================== SIMULATION SERVICE ====================
  simulation-service:
    build: ./services/simulation-service
    container_name: simulation-service
    ports:
      - "8011:8000"
    environment:
      TRIP_SERVICE_URL: http://trip-service:8000
      ROUTE_SERVICE_URL: http://route-service:8000
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: uce/trips/location
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_TRIPS: trips
      KAFKA_ENABLED: "true"
      SIMULATION_INTERVAL: 2.0
      SIMULATION_SPEED_MULTIPLIER: 1.0
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy
      trip-service:
        condition: service_started
      route-service:
        condition: service_started
    networks:
      - uce-net
    restart: unless-stopped