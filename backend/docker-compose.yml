services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uce_default
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auth Service → uce_auth
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
      JWT_ISSUER: uce-safe-ride
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    restart: unless-stopped

  # Student Service → uce_student
  student-service:
    build:
      context: .
      dockerfile: services/student-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_student
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
      JWT_ISSUER: uce-safe-ride
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    restart: unless-stopped

  # Driver Service → uce_driver
  driver-service:
    build:
      context: ./services/driver-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_driver
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8000"

  # Vehicle Service → uce_vehicle
  vehicle-service:
    build:
      context: .
      dockerfile: services/vehicle-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_vehicle
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
      JWT_ISSUER: uce-safe-ride
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8000"
    restart: unless-stopped

  # Route Service → uce_route
  route-service:
    build:
      context: .
      dockerfile: services/route-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/uce_route
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-change-me}
      JWT_ISSUER: uce-safe-ride
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8000"
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build: services/api-gateway
    ports:
      - "8015:8000"
    depends_on:
      - auth-service
      - student-service
      - driver-service
      - vehicle-service
      - route-service
    restart: unless-stopped

volumes:
  postgres_data:
